# Production profile — activate with: --spring.profiles.active=prod
# All sensitive values must be supplied via environment variables (no hardcoded defaults here).
#
# Required environment variables:
#   DB_URL              e.g. jdbc:postgresql://<host>:5432/hrms?sslmode=require
#   DB_USERNAME         database user
#   DB_PASSWORD         database password
#   JWT_SECRET          min 256-bit random string
#   CORS_ALLOWED_ORIGINS  e.g. https://yourdomain.com
#   FILE_UPLOAD_DIR     absolute path to persistent volume, e.g. /data/media
#
# DDL strategy:
#   First deploy  → set DDL_AUTO=update  (lets Hibernate create the schema)
#   After that    → set DDL_AUTO=validate (prevents accidental schema changes)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false

# Production deployments must never seed sample records or automatically mutate
# tenant schemas. DataSeeder and TenantSchemaSyncRunner are excluded from prod.

# Required when the app runs behind Apache/Nginx reverse proxy.
server.forward-headers-strategy=framework
