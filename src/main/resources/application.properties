spring.application.name=accruehr
# Demo organizations must be explicitly requested; never recreate removed tenants.
app.seed.enabled=${APP_SEED_ENABLED:false}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cloudhrms_local}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Fail fast instead of hanging forever if a query is blocked waiting on a lock
# held by another (possibly stuck) transaction — a stuck delete previously pinned
# a connection for 2 hours and starved the whole pool.
spring.datasource.hikari.connection-init-sql=SET lock_timeout='10s'
# Log a warning with stack trace if a connection is checked out for over 60s,
# so a stuck transaction is caught immediately instead of discovered via outage.
spring.datasource.hikari.leak-detection-threshold=60000

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=${FILE_UPLOAD_DIR:./media}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081}

# Session
server.servlet.session.timeout=300s

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from-name=${APP_MAIL_FROM_NAME:AccrueHRMS}

# Error handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Spring Cache (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Springdoc
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Razorpay billing: keep secrets in process environment or secret manager.
app.billing.key-id=${RAZORPAY_KEY_ID:}
app.billing.key-secret=${RAZORPAY_KEY_SECRET:}
app.billing.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.billing.frontend-url=${BILLING_FRONTEND_URL:http://localhost:5173}
app.billing.instance-id=${BILLING_INSTANCE_ID:hrms}
app.billing.prices.basic-monthly=${RAZORPAY_PLAN_BASIC_MONTHLY:}
app.billing.prices.basic-yearly=${RAZORPAY_PLAN_BASIC_YEARLY:}
app.billing.prices.standard-monthly=${RAZORPAY_PLAN_STANDARD_MONTHLY:}
app.billing.prices.standard-yearly=${RAZORPAY_PLAN_STANDARD_YEARLY:}
app.billing.prices.enterprise-monthly=${RAZORPAY_PLAN_ENTERPRISE_MONTHLY:}
app.billing.prices.enterprise-yearly=${RAZORPAY_PLAN_ENTERPRISE_YEARLY:}

# Temporary admin-only bypass; leave disabled for normal production billing.
app.billing.manual-enabled=${BILLING_MANUAL_ENABLED:false}

# Private local SMTP settings (not included in source control).
spring.config.import=optional:file:./.runtime/smtp.properties

# Public origin used by welcome and password-reset email links.
app.frontend-url=${APP_FRONTEND_URL:${BILLING_FRONTEND_URL:http://localhost:5173}}

# Approved transactional billing reminders: 7, 3, 1 days, renewal day, expiry and past-due.
app.billing.notices.enabled=${BILLING_NOTICES_ENABLED:true}
app.billing.notices.scan-ms=${BILLING_NOTICES_SCAN_MS:3600000}
