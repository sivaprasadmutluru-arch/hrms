map $uri $accruehr_auth_key {
    default "";
    ~^/api/auth/(login|forgot-password|reset-password)$ $binary_remote_addr;
}
limit_req_zone $accruehr_auth_key zone=accruehr_auth:10m rate=30r/m;
server {
    listen 80;
    server_name hr.accruetechnologies.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/accruehr-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name hr.accruetechnologies.com;
    ssl_certificate /etc/letsencrypt/live/hr.accruetechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr.accruetechnologies.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    limit_req zone=accruehr_auth burst=30 nodelay;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:4184;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 70s;
    }
}
